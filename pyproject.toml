[project]
name = "dlsu-canvas-mcp-server"
version = "0.1.0"
description = "Standalone, public-ready Canvas LMS MCP Server for De La Salle University (DLSU) peers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "rapidfuzz>=3.12.1",
    "pypdf>=5.3.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "html2text>=2024.2.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
